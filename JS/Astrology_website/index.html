<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Destiny - Astrology Predictor</title>
    <!-- Corrected stylesheet link -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1>Cosmic Destiny</h1>
        <p class="subtitle">Enter your details to align with the stars</p>

        <form id="astrologyForm" onsubmit="generateDestiny(event)">
            <div class="form-group">
                <label for="userName">Your Name</label>
                <input type="text" id="userName" placeholder="e.g., Yogesh" required>
            </div>

            <div class="form-group">
                <label for="userDob">Date of Birth</label>
                <input type="date" id="userDob" required>
            </div>

            <button type="submit">Read My Stars</button>
        </form>

        <!-- Dynamic Results Card -->
        <div id="resultsCard" class="results-card">
            <h2 id="greeting" style="margin-bottom: 10px;"></h2>
            <div id="zodiacSign" class="zodiac-badge"></div>

            <div class="prediction-section">
                <div class="prediction-title">The Path Ahead (Career & Goals)</div>
                <p id="careerPrediction" class="prediction-text"></p>

                <div class="prediction-title">Emotional Currents (Relationships)</div>
                <p id="lovePrediction" class="prediction-text"></p>
                
                <div class="prediction-title">Lunar Advice</div>
                <p id="lunarAdvice" class="prediction-text" style="font-style: italic; border-left: none; background: rgba(138, 43, 226, 0.1);"></p>
            </div>
            <p id="cosmicCompliment" style="color: var(--accent-gold); font-size: 0.95rem; margin-bottom: 25px; font-style: italic; line-height: 1.5;"></p>
        </div>
        <h2 id="greeting" style="margin-bottom: 10px;"></h2>

    </div>

    <!-- Linked JS file right before closing body -->
    <script src="./app.js"></script>
</body>
</html>
